<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correo distinto en clase — Fundación ROFÉ</title>
<style>
  :root{
    --navy-0:#070332;
    --navy-1:#16283D;
    --navy-2:#2B4A6F;
    --amarillo:#EEC935;
    --naranja:#D1793F;
    --rojo:#C12D4C;
    --azul:#406C9E;
    --verde:#6EA050;
    --rosa:#f06fa0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:"Century Gothic","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(60% 50% at 15% 10%, rgba(64,108,158,0.35), transparent 60%),
      radial-gradient(55% 45% at 90% 15%, rgba(193,45,76,0.25), transparent 60%),
      radial-gradient(70% 60% at 50% 100%, rgba(43,74,111,0.45), transparent 60%),
      linear-gradient(160deg, var(--navy-0) 0%, var(--navy-1) 55%, var(--navy-0) 100%);
    background-attachment:fixed;
    color:#fff;
    overflow-x:hidden;
    position:relative;
  }

  /* ---- Particulas rosadas que titilan ---- */
  .particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .particle{
    position:absolute;
    border-radius:50%;
    background:var(--rosa);
    box-shadow:0 0 8px 2px rgba(240,111,160,0.7);
    animation:float linear infinite, twinkle ease-in-out infinite;
  }
  @keyframes float{
    from{ transform:translateY(0); }
    to{ transform:translateY(-110vh); }
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; }
    50%{ opacity:.9; }
  }

  /* ---- Tarjeta glass ---- */
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    border-radius:28px;
    padding:36px 32px 28px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.16);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 60px -15px rgba(193,45,76,0.35);
    animation:rise .7s cubic-bezier(.21,.79,.32,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(22px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    background:linear-gradient(90deg,var(--amarillo),var(--naranja) 45%,var(--rojo));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0 0 14px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--verde);
    box-shadow:0 0 10px 2px var(--verde);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.4); opacity:.55; }
  }

  h1{
    margin:0 0 10px;
    font-size:clamp(22px,4vw,30px);
    line-height:1.2;
    font-weight:600;
    color:#fff;
  }
  p.sub{
    margin:0 0 26px;
    color:rgba(255,255,255,0.68);
    font-size:15px;
    line-height:1.55;
    max-width:52ch;
  }

  .form-shell{
    position:relative;
    border-radius:18px;
    padding:3px;
    background:linear-gradient(120deg,var(--amarillo),var(--rojo) 40%,var(--azul) 75%,var(--verde));
    background-size:300% 300%;
    animation:borderflow 8s ease infinite;
  }
  @keyframes borderflow{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .form-inner{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    aspect-ratio:640/834;
  }
  .form-inner iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }

  footer{
    margin-top:22px;
    text-align:center;
    font-size:12px;
    color:rgba(255,255,255,0.4);
    font-style:italic;
  }

  @media (prefers-reduced-motion: reduce){
    .particle{ animation:none; opacity:.3; }
    .card{ animation:none; }
    .form-shell{ animation:none; background-position:0% 50%; }
    .eyebrow .dot{ animation:none; }
  }
</style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <main class="card">
    <p class="eyebrow"><span class="dot"></span>Fundación ROFÉ · Jóvenes creaTIvos</p>
    <h1>Correo distinto en clase</h1>
    <p class="sub">
      Identificación de caso — completa esto si entraste hoy a la clase de Zoom con un
      correo diferente al que tienes registrado. Solo toma un minuto.
    </p>

    <div class="form-shell">
      <div class="form-inner">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLScqCGtzmDaUQnDXNl_jH5h4jSXpxhP4DSBQJWjauBn7eJGwIA/viewform?embedded=true"
          marginheight="0" marginwidth="0">Cargando…</iframe>
      </div>
    </div>

    <footer>“Si quieres cambiar el mundo, toca una vida.”</footer>
  </main>

  <script>
    // Particulas rosadas -- generadas una vez, sin dependencias externas
    var wrap = document.getElementById('particles');
    var N = 26;
    for (var i = 0; i < N; i++) {
      var d = document.createElement('div');
      d.className = 'particle';
      var size = 2 + Math.random() * 4;
      d.style.width = size + 'px';
      d.style.height = size + 'px';
      d.style.left = (Math.random() * 100) + 'vw';
      d.style.top = (100 + Math.random() * 20) + 'vh';
      d.style.animationDuration = (10 + Math.random() * 14) + 's, ' + (2 + Math.random() * 3) + 's';
      d.style.animationDelay = (-Math.random() * 20) + 's, ' + (-Math.random() * 3) + 's';
      wrap.appendChild(d);
    }
  </script>
</body>
</html>
